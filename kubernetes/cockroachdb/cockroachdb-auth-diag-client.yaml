apiVersion: v1
kind: Pod
metadata:
  name: cockroachdb-auth-diag-client
  namespace: cockroachdb
  labels:
    app.kubernetes.io/name: cockroachdb-auth-diag-client
    app.kubernetes.io/component: diagnostic-client
spec:
  restartPolicy: Never
  containers:
    - name: cockroach
      image: cockroachdb/cockroach:v26.3.2
      command:
        - sleep
        - "1800"
      volumeMounts:
        - name: client-certs
          mountPath: /cockroach-certs
          readOnly: true
  volumes:
    - name: client-certs
      secret:
        secretName: cockroachdb-client-secret
        defaultMode: 256
        items:
          - key: ca.crt
            path: ca.crt
            mode: 256
          - key: tls.crt
            path: client.root.crt
            mode: 256
          - key: tls.key
            path: client.root.key
            mode: 256

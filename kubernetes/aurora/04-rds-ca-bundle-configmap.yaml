apiVersion: v1
kind: ConfigMap
metadata:
  name: rds-ca-bundle
  namespace: aurora-benchmark
  labels:
    app.kubernetes.io/name: aurora-benchmark
    app.kubernetes.io/part-of: ric-gray-failure-research
data:
  # Instructions & Hash validation for AWS RDS Global Root CA Bundle
  # Download source: https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
  ca_bundle_notes: |
    In production AWS EKS execution, the global-bundle.pem is mounted into the client pod
    at /etc/ssl/certs/rds-ca-bundle.pem.
    Client environment sets:
      PGSSLMODE=verify-full
      PGSSLROOTCERT=/etc/ssl/certs/rds-ca-bundle.pem


apiVersion: v1
kind: Pod
metadata:
  name: crdb-benchmark-client-hardened
  namespace: cockroachdb
  labels:
    app.kubernetes.io/name: crdb-benchmark-client-hardened
    app.kubernetes.io/component: benchmark-diagnostic
    app.kubernetes.io/part-of: ric-gray-failure-research
    security.ric.research/profile: hardened-read-only
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: pgbench
      image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      env:
        - name: PGHOST
          value: "cockroachdb-public.cockroachdb.svc.cluster.local"
        - name: PGPORT
          value: "26257"
        - name: PGUSER
          value: "root"
        - name: PGDATABASE
          value: "benchdb"
        - name: PGSSLMODE
          value: "verify-full"
        - name: PGSSLROOTCERT
          value: "/cockroach-certs/ca.crt"
        - name: PGSSLCERT
          value: "/cockroach-certs/client.root.crt"
        - name: PGSSLKEY
          value: "/cockroach-certs/client.root.key"
        - name: HOME
          value: "/tmp"
        - name: PSQL_HISTORY
          value: "/tmp/.psql_history"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: "350m"
          memory: "512Mi"
        limits:
          cpu: "1500m"
          memory: "1024Mi"
      volumeMounts:
        - name: client-certs
          mountPath: /cockroach-certs
          readOnly: true
        - name: tmp-volume
          mountPath: /tmp
        - name: run-volume
          mountPath: /var/run/postgresql

  volumes:
    - name: client-certs
      secret:
        secretName: cockroachdb-client-secret
        defaultMode: 256 # octal 0400
        items:
          - key: ca.crt
            path: ca.crt
            mode: 256 # octal 0400
          - key: tls.crt
            path: client.root.crt
            mode: 256 # octal 0400
          - key: tls.key
            path: client.root.key
            mode: 256 # octal 0400
    - name: tmp-volume
      emptyDir:
        medium: Memory
        sizeLimit: 64Mi
    - name: run-volume
      emptyDir:
        medium: Memory
        sizeLimit: 16Mi

apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: g4-cpu-starvation-l2
  namespace: chaos-mesh
  labels:
    app.kubernetes.io/name: chaos-mesh
    app.kubernetes.io/component: stresschaos
    experiment.ric.research/protocol: G4-01
    experiment.ric.research/level: L2
spec:
  mode: one
  selector:
    namespaces:
      - cockroachdb
    pods:
      cockroachdb:
        - cockroachdb-1
  containerNames:
    - db
  stressors:
    cpu:
      workers: 1
      load: 90
  duration: "180s"

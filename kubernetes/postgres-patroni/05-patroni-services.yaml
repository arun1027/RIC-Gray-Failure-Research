apiVersion: v1
kind: Service
metadata:
  name: patroni-headless
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: ric-gray-failure-research
    ric.thesis/subsystem: postgres-patroni
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
    - name: patroni-api
      port: 8008
      targetPort: 8008
  selector:
    app.kubernetes.io/name: patroni
---
apiVersion: v1
kind: Service
metadata:
  name: patroni-primary
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: ric-gray-failure-research
    ric.thesis/subsystem: postgres-patroni
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: patroni
    spilo-role: master
---
apiVersion: v1
kind: Service
metadata:
  name: patroni-replica
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: ric-gray-failure-research
    ric.thesis/subsystem: postgres-patroni
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app.kubernetes.io/name: patroni
    spilo-role: replica


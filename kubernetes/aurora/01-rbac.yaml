apiVersion: v1
kind: ServiceAccount
metadata:
  name: aurora-benchmark-sa
  namespace: aurora-benchmark
  labels:
    app.kubernetes.io/name: aurora-benchmark
    app.kubernetes.io/part-of: ric-gray-failure-research
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aurora-benchmark-role
  namespace: aurora-benchmark
  labels:
    app.kubernetes.io/name: aurora-benchmark
    app.kubernetes.io/part-of: ric-gray-failure-research
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aurora-benchmark-rolebinding
  namespace: aurora-benchmark
  labels:
    app.kubernetes.io/name: aurora-benchmark
    app.kubernetes.io/part-of: ric-gray-failure-research
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aurora-benchmark-role
subjects:
  - kind: ServiceAccount
    name: aurora-benchmark-sa
    namespace: aurora-benchmark


apiVersion: v1
kind: ServiceAccount
metadata:
  name: patroni-sa
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: ric-gray-failure-research
    ric.thesis/subsystem: postgres-patroni
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: patroni-role
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: ric-gray-failure-research
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "patch", "update", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "patch", "update", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patroni-rolebinding
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: ric-gray-failure-research
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: patroni-role
subjects:
  - kind: ServiceAccount
    name: patroni-sa
    namespace: postgres-patroni


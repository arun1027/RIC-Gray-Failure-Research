name: "Terraform Format & Validate (Offline Guard)"

"on":
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: "Validate Terraform Configurations"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Repository (Read-Only)"
        uses: actions/checkout@v4

      - name: "Setup Terraform CLI (v1.5.7)"
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: "Verify Terraform Version"
        run: |
          echo "=== Terraform CLI Version ==="
          terraform version

      - name: "Terraform Format Check (Recursive, Read-Only)"
        run: |
          echo "=== Checking Terraform Formatting across terraform/ ==="
          terraform fmt -check -recursive terraform/

      - name: "Terraform Init (Backend Disabled, No Cloud Credentials)"
        working-directory: terraform/aws-eks
        run: |
          echo "=== Initializing Modules & Providers (backend=false) ==="
          terraform init -backend=false

      - name: "Terraform Validate (Static Schema & Syntax Check)"
        working-directory: terraform/aws-eks
        run: |
          echo "=== Validating Terraform Configuration ==="
          terraform validate

      - name: "Security & Guardrails Verification"
        run: |
          echo "=== Guardrails Assertion ==="
          echo "Validation completed without AWS credentials, remote backend, or state mutation."

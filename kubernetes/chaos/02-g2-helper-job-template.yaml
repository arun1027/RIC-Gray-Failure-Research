# G2 Privileged Chaos Helper Ephemeral Job Manifest Template
# Stage G2-4 Configuration Template (Prepared for review ONLY; DO NOT APPLY)
#
# SECURITY BOUNDARIES:
# - CAP_SYS_ADMIN + CAP_NET_ADMIN in initial user namespace (init_user_ns) with hostPID: true
#   is required strictly to setns(2) into target container netns for tc netem loss injection.
# - Blast radius bounded by: readOnlyRootFilesystem: true, allowPrivilegeEscalation: false,
#   hostNetwork: false, RuntimeDefault seccomp, no hostPath mounts, g1-chaos namespace.

apiVersion: batch/v1
kind: Job
metadata:
  name: g2-chaos-helper
  namespace: g1-chaos
  labels:
    app.kubernetes.io/name: g2-chaos-helper
    app.kubernetes.io/part-of: ric-gray-failure-research
    ric.research/scenario: g2
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: g2-chaos-helper
        ric.research/scenario: g2
    spec:
      serviceAccountName: g1-chaos-helper-sa
      restartPolicy: Never
      # Pinned dynamically to target worker node hosting the active Range 108 leaseholder
      nodeName: <TARGET_WORKER_NODE_NAME>
      hostPID: true
      hostNetwork: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: g2-helper
          # Immutable digest requirement: Pinned after ECR build and push
          image: 397916376204.dkr.ecr.us-east-1.amazonaws.com/ric-g2-helper@sha256:c91021ab1a9ab57edecb8a72ad2e872b60e85231f600a3a030f81360d6cb5924
          imagePullPolicy: IfNotPresent
          env:
            - name: G2_RUN_ID
              value: "<RUN_ID>"
            - name: G2_TARGET_POD
              value: "<TARGET_COCKROACHDB_POD>"
            - name: G2_TARGET_NAMESPACE
              value: "cockroachdb"
            - name: G2_TARGET_INTERFACE
              value: "eth0"
            - name: G2_LOSS_PERCENTAGE
              value: "<LOSS_PERCENTAGE>"
            - name: G2_DURATION_SEC
              value: "180"
            - name: G2_AUTH_TOKEN_DIR
              value: "/var/run/g2-auth"
            - name: G2_AUTH_LOCK_DIR
              value: "/var/run/g2-lock"
            - name: G2_AUTH_ALLOW_READONLY_SECRET
              value: "1"
            - name: G2_CLAIM_NAMESPACE
              value: "g1-chaos"
            - name: G2_HELPER_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: G2_HELPER_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          securityContext:
            runAsUser: 0
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
                - SYS_ADMIN
                - SYS_PTRACE
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          ports:
            - name: health
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /readyz
              port: 8081
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: tmp-ephemeral
              mountPath: /tmp
            - name: lock-dir
              mountPath: /var/run/g2-lock
            - name: fault-auth-token
              mountPath: /var/run/g2-auth
              readOnly: true
      volumes:
        - name: tmp-ephemeral
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: lock-dir
          emptyDir:
            medium: Memory
            sizeLimit: 4Mi
        - name: fault-auth-token
          secret:
            secretName: g2-fault-auth-token


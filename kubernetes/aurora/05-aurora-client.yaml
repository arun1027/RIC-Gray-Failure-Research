apiVersion: v1
kind: Pod
metadata:
  name: aurora-benchmark-client
  namespace: aurora-benchmark
  labels:
    app.kubernetes.io/name: aurora-benchmark-client
    app.kubernetes.io/component: benchmark-workload
    ric.benchmark/system: aurora
    ric.thesis/ca2-compliance: "true"
spec:
  serviceAccountName: aurora-benchmark-sa
  restartPolicy: Never
  containers:
    - name: client
      image: postgres:16
      command: ["sleep", "7200"]
      env:
        - name: PGHOST
          value: "ric-gray-failure-aurora-cluster.cluster-cx0kj4b808or.us-east-1.rds.amazonaws.com"
        - name: PGHOST_READER
          value: "ric-gray-failure-aurora-cluster.cluster-ro-cx0kj4b808or.us-east-1.rds.amazonaws.com"
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          value: "postgres"
        - name: PGDATABASE
          value: "benchdb"
        - name: PGSSLMODE
          value: "verify-full"
        - name: PGSSLROOTCERT
          value: "/etc/ssl/certs/rds-ca-bundle.pem"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: aurora-credentials
              key: database-password
      volumeMounts:
        - name: rds-ca-volume
          mountPath: /etc/ssl/certs
          readOnly: true
        - name: logs-volume
          mountPath: /logs
      resources:
        requests:
          cpu: "350m"
          memory: "512Mi"
        limits:
          cpu: "1500m"
          memory: "1024Mi"
  volumes:
    - name: rds-ca-volume
      configMap:
        name: rds-ca-bundle
    - name: logs-volume
      emptyDir: {}


apiVersion: v1
kind: Pod
metadata:
  name: crdb-benchmark-client
  namespace: cockroachdb
  labels:
    app.kubernetes.io/name: crdb-benchmark-client
    app.kubernetes.io/component: benchmark-workload
    ric.benchmark/system: crdb
spec:
  restartPolicy: Never
  containers:
    - name: pgbench
      image: postgres:16
      command: ["sleep", "7200"]
      env:
        - name: PGHOST
          value: "cockroachdb-public.cockroachdb.svc.cluster.local"
        - name: PGPORT
          value: "26257"
        - name: PGUSER
          value: "root"
        - name: PGDATABASE
          value: "benchdb"
        - name: PGSSLMODE
          value: "verify-full"
        - name: PGSSLROOTCERT
          value: "/cockroach-certs/ca.crt"
        - name: PGSSLCERT
          value: "/cockroach-certs/client.root.crt"
        - name: PGSSLKEY
          value: "/cockroach-certs/client.root.key"
      volumeMounts:
        - name: client-certs
          mountPath: /cockroach-certs
          readOnly: true
        - name: logs-volume
          mountPath: /logs
      resources:
        requests:
          cpu: "350m"
          memory: "512Mi"
        limits:
          cpu: "1500m"
          memory: "1024Mi"
  volumes:
    - name: client-certs
      secret:
        secretName: cockroachdb-client-secret
        defaultMode: 0400
        items:
          - key: ca.crt
            path: ca.crt
            mode: 0400
          - key: tls.crt
            path: client.root.crt
            mode: 0400
          - key: tls.key
            path: client.root.key
            mode: 0400
    - name: logs-volume
      emptyDir: {}


apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-config
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/part-of: ric-gray-failure-research
    ric.thesis/subsystem: postgres-patroni
    ric.thesis/ca2-compliance: "true"
data:
  patroni.yml: |
    scope: postgres-patroni-cluster
    namespace: /service

    restapi:
      listen: 0.0.0.0:8008

    etcd3:
      hosts:
        - etcd-0.etcd-headless.postgres-patroni.svc.cluster.local:2379
        - etcd-1.etcd-headless.postgres-patroni.svc.cluster.local:2379
        - etcd-2.etcd-headless.postgres-patroni.svc.cluster.local:2379

    bootstrap:
      dcs:
        ttl: 30
        loop_wait: 10
        retry_timeout: 10
        maximum_lag_on_failover: 1048576
        # CA2 Protocol Requirement: Synchronous streaming replication
        synchronous_mode: true
        synchronous_mode_strict: false
        synchronous_node_count: 1
        postgresql:
          use_pg_rewind: true
          use_slots: true
          parameters:
            max_connections: 100
            shared_buffers: 256MB
            work_mem: 16MB
            maintenance_work_mem: 64MB
            effective_cache_size: 768MB
            wal_level: replica
            max_wal_size: 1GB
            min_wal_size: 80MB
            checkpoint_completion_target: 0.9
            wal_keep_size: 512MB
            hot_standby: "on"
            synchronous_commit: "on"
            track_io_timing: "on"
            track_functions: "all"
            logging_collector: "off"
            log_destination: "stderr"
            log_min_duration_statement: 250
            log_line_prefix: '%m [%p] %q%u@%d '
          pg_hba:
            - local all postgres trust
            - local replication replicator trust
            - host replication replicator 0.0.0.0/0 md5
            - host all all 0.0.0.0/0 md5
            - host all all 127.0.0.1/32 trust
            - host replication replicator 127.0.0.1/32 trust

      initdb:
        - encoding: UTF8
        - data-checksums

      pg_hba:
        - local all postgres trust
        - local replication replicator trust
        - host replication replicator 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5
        - host all all 127.0.0.1/32 trust
        - host replication replicator 127.0.0.1/32 trust

    postgresql:
      listen: 0.0.0.0:5432
      data_dir: /home/postgres/pgdata/data
      bin_dir: /usr/lib/postgresql/15/bin
      pgpass: /home/postgres/.pgpass
      pg_hba:
        - local all postgres trust
        - local replication replicator trust
        - host replication replicator 0.0.0.0/0 md5
        - host all all 0.0.0.0/0 md5
        - host all all 127.0.0.1/32 trust
        - host replication replicator 127.0.0.1/32 trust
      authentication:
        replication:
          username: replicator
          password: ${PATRONI_REPLICATION_PASSWORD}
        superuser:
          username: postgres
          password: ${PATRONI_SUPERUSER_PASSWORD}

    tags:
      nofailover: false
      noloadbalance: false
      clonefrom: false
      nosync: false


apiVersion: v1
kind: Service
metadata:
  name: etcd-headless
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: ric-gray-failure-research
    ric.thesis/subsystem: patroni-dcs
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: peer
      port: 2380
      targetPort: 2380
    - name: client
      port: 2379
      targetPort: 2379
  selector:
    app.kubernetes.io/name: etcd
---
apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: ric-gray-failure-research
    ric.thesis/subsystem: patroni-dcs
spec:
  type: ClusterIP
  ports:
    - name: client
      port: 2379
      targetPort: 2379
  selector:
    app.kubernetes.io/name: etcd
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: postgres-patroni
  labels:
    app.kubernetes.io/name: etcd
    app.kubernetes.io/part-of: ric-gray-failure-research
    ric.thesis/subsystem: patroni-dcs
spec:
  serviceName: etcd-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: etcd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: etcd
        app.kubernetes.io/part-of: ric-gray-failure-research
        ric.thesis/subsystem: patroni-dcs
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["etcd"]
              topologyKey: topology.kubernetes.io/zone
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["etcd"]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: etcd
          # Pinned official multi-arch Bitnami etcd 3.5 release (CA2 DCS requirement)
          image: bitnamilegacy/etcd:3.5.12-debian-12-r10@sha256:6b33796fc16ac9a05317ffef185837cb4db2e45a4a6c72b7f00103108b4e4d7a
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
          env:
            - name: ALLOW_NONE_AUTHENTICATION
              value: "yes"
            - name: ETCD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: ETCD_INITIAL_CLUSTER
              value: "etcd-0=http://etcd-0.etcd-headless.postgres-patroni.svc.cluster.local:2380,etcd-1=http://etcd-1.etcd-headless.postgres-patroni.svc.cluster.local:2380,etcd-2=http://etcd-2.etcd-headless.postgres-patroni.svc.cluster.local:2380"
            - name: ETCD_INITIAL_CLUSTER_STATE
              value: "new"
            - name: ETCD_INITIAL_CLUSTER_TOKEN
              value: "patroni-etcd-cluster-token"
            - name: ETCD_INITIAL_ADVERTISE_PEER_URLS
              value: "http://$(ETCD_NAME).etcd-headless.postgres-patroni.svc.cluster.local:2380"
            - name: ETCD_LISTEN_PEER_URLS
              value: "http://0.0.0.0:2380"
            - name: ETCD_LISTEN_CLIENT_URLS
              value: "http://0.0.0.0:2379"
            - name: ETCD_ADVERTISE_CLIENT_URLS
              value: "http://$(ETCD_NAME).etcd-headless.postgres-patroni.svc.cluster.local:2379"
            - name: ETCD_DATA_DIR
              value: "/bitnami/etcd/data"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 2379
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: etcd-data
              mountPath: /bitnami/etcd/data
  volumeClaimTemplates:
    - metadata:
        name: etcd-data
        labels:
          app.kubernetes.io/name: etcd
          app.kubernetes.io/part-of: ric-gray-failure-research
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: gp3-csi
        resources:
          requests:
            storage: 1Gi

